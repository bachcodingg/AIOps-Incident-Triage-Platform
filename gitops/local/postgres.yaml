# Plain StatefulSet for week 1. Replaced by a CloudNativePG cluster in week 3.
# The password lives in the `postgres-credentials` Secret, which `make up`
# generates with a random value; it is never committed.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: {app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: shopsearch}
spec:
  selector: {app.kubernetes.io/name: postgres}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: {app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: shopsearch}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: shopsearch}
    spec:
      containers:
        - name: postgres
          image: postgres:17.6-alpine
          ports:
            - {name: postgres, containerPort: 5432}
          env:
            - {name: POSTGRES_DB, value: catalog}
            - {name: POSTGRES_USER, value: catalog}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: password}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "catalog", "-d", "catalog"]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: ["pg_isready", "-U", "catalog", "-d", "catalog"]}
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: {storage: 1Gi}
