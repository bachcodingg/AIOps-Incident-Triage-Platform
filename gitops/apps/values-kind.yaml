# Local cluster: one replica each to fit the laptop, and the gateway and Grafana
# on the NodePorts that infra/kind/cluster.yaml maps to the host.
addons:
  metrics-server:
    values:
      args: ["--kubelet-insecure-tls"] # kind's kubelet certificates have no IP SANs
  kube-prometheus-stack:
    values:
      grafana:
        service: {type: NodePort, nodePort: 30300}

workload:
  gateway:
    values:
      service: {type: NodePort, nodePort: 30080}
      autoscaling: {minReplicas: 1}
  search-api:
    values:
      autoscaling: {minReplicas: 1}
  catalog:
    values:
      autoscaling: {minReplicas: 1}
