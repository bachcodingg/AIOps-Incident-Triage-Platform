quarkus.application.name=catalog
quarkus.http.port=8080
quarkus.banner.enabled=false

# Overridden in Kubernetes through QUARKUS_DATASOURCE_* and QUARKUS_REDIS_HOSTS env vars.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://postgres:5432/catalog
quarkus.datasource.username=catalog
quarkus.datasource.jdbc.max-size=10
quarkus.redis.hosts=redis://redis:6379

# Flyway owns the schema; Hibernate only validates it.
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate

# Readiness reflects the database only. Catalog reads keep working when
# Redis is down, so Redis must not take catalog out of the Service.
quarkus.redis.health.enabled=false

# OpenTelemetry: traces and metrics over OTLP/HTTP to the node's collector agent.
# The chart sets OTEL_EXPORTER_OTLP_ENDPOINT and OTEL_RESOURCE_ATTRIBUTES, the
# same variables every service reads. Without them nothing is exported.
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.resource.attributes=${OTEL_RESOURCE_ATTRIBUTES:service.namespace=shopsearch}
quarkus.otel.sdk.disabled=${OTEL_SDK_DISABLED:false}
quarkus.otel.metrics.enabled=true
quarkus.otel.metric.export.interval=15s
quarkus.otel.logs.enabled=false
# HttpMetricsFilter records the request duration with the SLO buckets instead.
quarkus.otel.instrument.http-server-metrics=false
# Health probes are not traced.
quarkus.otel.traces.suppress-non-application-uris=true
# One span per SQL statement: the bottom of a product lookup trace.
quarkus.datasource.jdbc.telemetry=true

# JSON log lines on stdout. The trace and span ids come from the MDC, which the
# OpenTelemetry extension fills in for every request.
quarkus.log.console.json.enabled=true
quarkus.log.console.json.mdc.flat-fields=true
quarkus.log.console.json.key-overrides=timestamp=time,message=msg
%dev.quarkus.log.console.json.enabled=false

# Tests run against in-memory H2 in PostgreSQL mode, no containers needed.
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:catalog;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.redis.hosts=redis://localhost:6379
%test.quarkus.otel.sdk.disabled=true
%test.quarkus.log.console.json.enabled=false
quarkus.devservices.enabled=false
