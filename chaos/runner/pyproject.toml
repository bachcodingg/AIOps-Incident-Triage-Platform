[project]
name = "chaos-runner"
version = "0.1.0"
description = "Injects the faults in chaos/catalog.yaml and writes sealed ground truth."
requires-python = ">=3.12"
dependencies = ["PyYAML>=6"]

[project.scripts]
chaos-runner = "chaos_runner.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
