apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest
  annotations:
    policies.kyverno.io/description: A moving tag makes a rollback meaningless and hides what actually runs.
spec:
  validationActions: [Deny]
  evaluation:
    background: {enabled: false}
  {{- include "policies.matchPods" . | nindent 2 }}
  variables:
    {{- include "policies.containers" . | nindent 4 }}
    - name: untagged
      expression: >-
        variables.containers.map(c, c.image).filter(i, !i.contains(':') || i.endsWith(':latest'))
  validations:
    - expression: size(variables.untagged) == 0
      message: Images need an explicit tag, and it cannot be latest.
      messageExpression: >-
        'Images need an explicit tag, and it cannot be latest: ' + variables.untagged.join(', ')
