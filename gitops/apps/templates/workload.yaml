{{- range $name, $app := .Values.workload }}
{{- $values := deepCopy (default dict $app.values) }}
{{- if and $.Values.localImages $app.image }}
{{- $_ := set $values "image" (dict "repository" (printf "incidentlens/%s" $name) "tag" "dev" "digest" "" "pullPolicy" "Never") }}
{{- end }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $name }}
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: {{ $app.wave | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $.Values.workloadNamespace }}
  source:
    repoURL: {{ $.Values.repoURL }}
    targetRevision: {{ $.Values.revision }}
    path: gitops/charts/{{ $name }}
    helm:
      releaseName: {{ $name }}
      valuesObject:
        {{- toYaml $values | nindent 8 }}
  {{- if $app.image }}
  # A scale-out by the remediator (week 9) raises the HPA's minReplicas. Without
  # this, self-heal would put Git's value back within seconds. Git's value
  # returns with the next change to the chart, or when a human syncs.
  ignoreDifferences:
    - group: autoscaling
      kind: HorizontalPodAutoscaler
      jsonPointers: [/spec/minReplicas]
  {{- end }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      {{- if $app.image }}
      - RespectIgnoreDifferences=true
      {{- end }}
    retry:
      limit: 5
      backoff: {duration: 10s, factor: 2, maxDuration: 3m}
{{- end }}
