image:
  repository: ghcr.io/bachcodingg/incidentlens/catalog
  tag: sha-e18e92f1e18723dca03a7e3a2f01c6df22016f81
  digest: "sha256:65cfb5abc65ca835a59ddfcfadb5c98c38f9555153fc608f597019fcb1d3c960"
  pullPolicy: IfNotPresent

runAsUser: 10001

containerPort: {name: http, port: 8080}

service:
  enabled: true
  type: ClusterIP
  port: 8080
  nodePort: null

env:
  QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres-rw:5432/catalog
  QUARKUS_DATASOURCE_USERNAME: catalog
  QUARKUS_REDIS_HOSTS: redis://redis:6379

# CloudNativePG generates this secret. Nothing sensitive is stored in Git.
extraEnv:
  - name: QUARKUS_DATASOURCE_PASSWORD
    valueFrom:
      secretKeyRef: {name: postgres-app, key: password}

# The first start also runs the migrations, including the 2M-review seed.
startupProbe:
  httpGet: {path: /q/health/started, port: http}
  periodSeconds: 3
  failureThreshold: 80
readinessProbe:
  httpGet: {path: /q/health/ready, port: http}
  periodSeconds: 5
livenessProbe:
  httpGet: {path: /q/health/live, port: http}
  periodSeconds: 10

# The stateless services may run on kind's tainted worker node, the target of
# fault F14 (infra/kind/cluster.yaml). Harmless where no node has the taint.
tolerations:
  - {key: incidentlens.dev/pool, operator: Equal, value: workload, effect: NoSchedule}

resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {cpu: "1", memory: 384Mi}

autoscaling:
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilization: 70

# Traces and metrics go to the collector agent on the same node (the Service
# routes node-locally). Logs are read from stdout by the same agent.
otel:
  enabled: true
  endpoint: http://otel-agent.monitoring.svc:4318
  metricExportIntervalMs: 15000

rollout:
  pauseSeconds: 60
  progressDeadlineSeconds: 300

analysis:
  mode: http
  prometheusAddress: http://prometheus-operated.monitoring.svc:9090
  initialDelay: 45s
  interval: 30s
  requestsMetric: http_server_request_duration_seconds_count
  bucketMetric: http_server_request_duration_seconds_bucket
  errorMatcher: http_response_status_code=~"5.."
  maxErrorRateIncrease: 0.01
  maxP95Seconds: 0.3 # the latency SLO
  maxP95IncreaseSeconds: 0.1
