# Week 1: plain manifests applied by `make up`. Week 3 replaces this with
# Helm charts per service and an ArgoCD app-of-apps.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shopsearch
resources:
  - namespace.yaml
  - postgres.yaml
  - redis.yaml
  - catalog.yaml
  - search-api.yaml
  - indexer.yaml
  - gateway.yaml
