[project]
name = "incidentlens-eval"
version = "0.1.0"
description = "Evaluation harness: dataset freeze (gate G2), detection and triage scores, the final run on the test set and the results report (gate G3), the write-up's numbers and postmortem drafts."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The harness reads labels (chaos-runner) and runs the AIOps code on recordings.
pythonpath = [".", "../aiops", "../chaos/runner"]
