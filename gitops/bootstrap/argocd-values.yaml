# The one thing installed by hand, because something has to install ArgoCD.
# scripts/bootstrap-gitops.sh applies this and the root Application.
dex: {enabled: false}
notifications: {enabled: false}
applicationSet: {enabled: false}

configs:
  params:
    server.insecure: true
  cm:
    timeout.reconciliation: 60s
    # Argo CD dropped the health check for Application in 1.8. Without it a sync
    # wave would not wait for the previous wave's apps to become healthy.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil and obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
      return hs

controller:
  resources:
    requests: {cpu: 100m, memory: 192Mi}
    limits: {memory: 512Mi}

repoServer:
  resources:
    requests: {cpu: 50m, memory: 96Mi}
    limits: {memory: 256Mi}

server:
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 160Mi}

redis:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 64Mi}
