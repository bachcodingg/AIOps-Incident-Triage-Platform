# Worker: no Service, the health port is only used by the kubelet probes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: indexer
  labels: {app.kubernetes.io/name: indexer, app.kubernetes.io/part-of: shopsearch}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: indexer}
  template:
    metadata:
      labels: {app.kubernetes.io/name: indexer, app.kubernetes.io/part-of: shopsearch}
    spec:
      containers:
        - name: indexer
          image: incidentlens/indexer:dev
          ports:
            - {name: health, containerPort: 8081}
          env:
            - {name: REDIS_URL, value: "redis://redis:6379/0"}
            - {name: CATALOG_URL, value: "http://catalog:8080"}
          readinessProbe:
            httpGet: {path: /readyz, port: health}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            periodSeconds: 10
          resources:
            requests: {cpu: 25m, memory: 48Mi}
            limits: {memory: 128Mi}
