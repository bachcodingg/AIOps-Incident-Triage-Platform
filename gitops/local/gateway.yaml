apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels: {app.kubernetes.io/name: gateway, app.kubernetes.io/part-of: shopsearch}
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: gateway}
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080 # mapped to localhost:8080 by infra/kind/cluster.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels: {app.kubernetes.io/name: gateway, app.kubernetes.io/part-of: shopsearch}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: gateway}
  template:
    metadata:
      labels: {app.kubernetes.io/name: gateway, app.kubernetes.io/part-of: shopsearch}
    spec:
      containers:
        - name: gateway
          image: incidentlens/gateway:dev
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: SEARCH_API_URL, value: "http://search-api:8000"}
            - {name: CATALOG_URL, value: "http://catalog:8080"}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 160Mi}
