apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-limits
  annotations:
    policies.kyverno.io/description: A pod without limits can starve its neighbours and blur the chaos results.
spec:
  validationActions: [Deny]
  evaluation:
    background: {enabled: false}
  {{- include "policies.matchPods" . | nindent 2 }}
  variables:
    {{- include "policies.containers" . | nindent 4 }}
    - name: unlimited
      expression: >-
        variables.containers.filter(c,
          !('cpu' in c.?resources.?limits.orValue({})) ||
          !('memory' in c.?resources.?limits.orValue({}))
        ).map(c, c.name)
  validations:
    - expression: size(variables.unlimited) == 0
      message: Every container needs CPU and memory limits.
      messageExpression: >-
        'Every container needs CPU and memory limits, missing in: ' + variables.unlimited.join(', ')
