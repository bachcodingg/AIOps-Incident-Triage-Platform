# The operator creates the `postgres-rw` Service and the `postgres-app` secret
# with a generated password, so there is no secret to bootstrap by hand.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  labels: {app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: shopsearch}
spec:
  instances: {{ .Values.instances }}
  imageName: {{ .Values.image }}
  bootstrap:
    initdb:
      database: catalog
      owner: catalog
  storage:
    size: {{ .Values.storage.size }}
    {{- with .Values.storage.className }}
    storageClass: {{ . }}
    {{- end }}
  {{- with .Values.parameters }}
  postgresql:
    parameters:
      {{- toYaml . | nindent 6 }}
  {{- end }}
  resources:
    {{- toYaml .Values.resources | nindent 4 }}
---
# CloudNativePG serves PostgreSQL metrics (connections, locks, WAL, database
# size) on port `metrics` of every instance. Faults F11 to F13 show up here.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: postgres
  labels: {app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: shopsearch}
spec:
  selector:
    matchLabels: {cnpg.io/cluster: postgres}
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
