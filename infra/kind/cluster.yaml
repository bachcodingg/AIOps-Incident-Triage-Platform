# Local evaluation cluster: a control-plane node for the platform and the data
# stores, and a worker that only the stateless ShopSearch services tolerate.
# Fault F14 (node loss) stops the worker, so it takes part of the workload down
# but never Prometheus, Loki, Tempo, PostgreSQL or Redis with it.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: incidentlens
nodes:
  - role: control-plane
    extraPortMappings:
      # gateway NodePort -> http://localhost:8080 on the host
      - containerPort: 30080
        hostPort: 8080
        listenAddress: "127.0.0.1"
        protocol: TCP
      # Grafana NodePort -> http://localhost:3000 on the host
      - containerPort: 30300
        hostPort: 3000
        listenAddress: "127.0.0.1"
        protocol: TCP
  - role: worker
    labels:
      incidentlens.dev/pool: workload
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          taints:
            - {key: incidentlens.dev/pool, value: workload, effect: NoSchedule}
