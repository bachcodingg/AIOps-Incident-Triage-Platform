# `make gitops-lint` renders the chart next to this file and runs `kyverno test`.
# verify-signatures is proved against the real registry in scripts/canary-test.sh.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: shopsearch-policies
policies:
  - rendered.yaml
resources:
  - pods.yaml
variables: values.yaml
results:
  - policy: require-limits
    isValidatingPolicy: true
    kind: Pod
    resources: [shopsearch/good, shopsearch/latest-tag]
    result: pass
  - policy: require-limits
    isValidatingPolicy: true
    kind: Pod
    resources: [shopsearch/no-limits, shopsearch/memory-limit-only, shopsearch/init-without-limits]
    result: fail
  - policy: disallow-latest
    isValidatingPolicy: true
    kind: Pod
    resources: [shopsearch/good, shopsearch/chaos-pause]
    result: pass
  - policy: disallow-latest
    isValidatingPolicy: true
    kind: Pod
    resources: [shopsearch/latest-tag, shopsearch/no-tag, shopsearch/chaos-pause-latest]
    result: fail
  - policy: restrict-registries
    isValidatingPolicy: true
    kind: Pod
    resources: [shopsearch/good, shopsearch/chaos-pause]
    result: pass
  - policy: restrict-registries
    isValidatingPolicy: true
    kind: Pod
    resources: [shopsearch/unknown-registry]
    result: fail
  - policy: restrict-registries
    isValidatingPolicy: true
    kind: Pod
    resources: [default/elsewhere]
    result: skip
  - policy: disallow-latest
    isValidatingPolicy: true
    kind: Pod
    resources: [default/elsewhere]
    result: skip
