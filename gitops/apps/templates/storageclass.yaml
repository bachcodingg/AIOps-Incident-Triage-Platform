{{- if .Values.storageClass.create }}
# EKS has no default StorageClass. Prometheus, Loki and Tempo claim volumes in
# the first waves, so the class has to exist before any Application syncs.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.storageClass.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
{{- end }}
