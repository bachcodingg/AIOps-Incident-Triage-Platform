instances: 1
image: ghcr.io/cloudnative-pg/postgresql:17.6

storage:
  size: 1Gi
  className: "" # empty means the cluster's default StorageClass (gp3 on EKS, see gitops/apps)

# Fault F12 turns every product lookup into a sequential scan of two million
# rows. The CPU limit is part of that fault: at 500m a scan takes long enough
# that lookups queue and catalog p95 passes 0.25s at any hour of the load
# curve, while at 1 CPU it stayed under the threshold. The memory is not: at
# 256Mi, with parallel workers per scan, PostgreSQL crash-looped under the
# fault and the rolled-back catalog had no database to start against. The
# fault should saturate the database, not kill it.
resources:
  requests: {cpu: 250m, memory: 256Mi}
  limits: {cpu: 500m, memory: 512Mi}

# PostgreSQL settings (strings, as CloudNativePG wants them).
parameters:
  # On half a CPU, parallel workers only add processes and memory per query.
  max_parallel_workers_per_gather: "0"
