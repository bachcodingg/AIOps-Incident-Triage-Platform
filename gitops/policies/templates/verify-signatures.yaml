apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-signatures
  annotations:
    policies.kyverno.io/description: Only images signed by the release workflow on main can run.
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 30
  evaluation:
    background: {enabled: false}
  {{- include "policies.matchPods" . | nindent 2 }}
  matchImageReferences:
    - glob: {{ .Values.signedImages | quote }}
  validationConfigurations:
    # release.yml writes the digest into Git, so the pod spec already pins it.
    mutateDigest: false
    verifyDigest: true
    required: true
  attestors:
    - name: release
      cosign:
        keyless:
          identities:
            - issuer: {{ .Values.signer.issuer | quote }}
              subject: {{ .Values.signer.subject | quote }}
        ctlog:
          url: https://rekor.sigstore.dev
  validations:
    - expression: >-
        images.containers.map(i, verifyImageSignatures(i, [attestors.release])).all(n, n > 0)
      message: Images from our registry must be signed by the release workflow on main.
