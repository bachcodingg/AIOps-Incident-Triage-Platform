apiVersion: v1
kind: Pod
metadata: {name: good, namespace: shopsearch}
spec:
  containers:
    - name: app
      image: redis:8.2-alpine
      resources:
        limits: {cpu: 100m, memory: 64Mi}
---
apiVersion: v1
kind: Pod
metadata: {name: no-limits, namespace: shopsearch}
spec:
  containers:
    - name: app
      image: redis:8.2-alpine
---
apiVersion: v1
kind: Pod
metadata: {name: memory-limit-only, namespace: shopsearch}
spec:
  containers:
    - name: app
      image: redis:8.2-alpine
      resources:
        limits: {memory: 64Mi}
---
apiVersion: v1
kind: Pod
metadata: {name: init-without-limits, namespace: shopsearch}
spec:
  initContainers:
    - name: init
      image: redis:8.2-alpine
  containers:
    - name: app
      image: redis:8.2-alpine
      resources:
        limits: {cpu: 100m, memory: 64Mi}
---
apiVersion: v1
kind: Pod
metadata: {name: latest-tag, namespace: shopsearch}
spec:
  containers:
    - name: app
      image: redis:latest
      resources:
        limits: {cpu: 100m, memory: 64Mi}
---
apiVersion: v1
kind: Pod
metadata: {name: no-tag, namespace: shopsearch}
spec:
  containers:
    - name: app
      image: redis
      resources:
        limits: {cpu: 100m, memory: 64Mi}
---
apiVersion: v1
kind: Pod
metadata: {name: unknown-registry, namespace: shopsearch}
spec:
  containers:
    - name: app
      image: quay.io/someone/miner:1.0
      resources:
        limits: {cpu: 100m, memory: 64Mi}
---
# What Chaos Mesh's pod-failure (fault F10) turns a Redis pod into.
apiVersion: v1
kind: Pod
metadata: {name: chaos-pause, namespace: shopsearch}
spec:
  containers:
    - name: redis
      image: registry.k8s.io/pause:3.10
      resources:
        limits: {cpu: 250m, memory: 128Mi}
---
# The pause image, but not the pinned tag.
apiVersion: v1
kind: Pod
metadata: {name: chaos-pause-latest, namespace: shopsearch}
spec:
  containers:
    - name: redis
      image: registry.k8s.io/pause:latest
      resources:
        limits: {cpu: 250m, memory: 128Mi}
