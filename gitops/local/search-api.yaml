apiVersion: v1
kind: Service
metadata:
  name: search-api
  labels: {app.kubernetes.io/name: search-api, app.kubernetes.io/part-of: shopsearch}
spec:
  selector: {app.kubernetes.io/name: search-api}
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-api
  labels: {app.kubernetes.io/name: search-api, app.kubernetes.io/part-of: shopsearch}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: search-api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: search-api, app.kubernetes.io/part-of: shopsearch}
    spec:
      containers:
        - name: search-api
          image: incidentlens/search-api:dev
          ports:
            - {name: http, containerPort: 8000}
          env:
            - {name: REDIS_URL, value: "redis://redis:6379/0"}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {memory: 192Mi}
