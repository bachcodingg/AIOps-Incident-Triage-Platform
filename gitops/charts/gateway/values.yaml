image:
  repository: ghcr.io/bachcodingg/incidentlens/gateway
  tag: sha-e18e92f1e18723dca03a7e3a2f01c6df22016f81
  digest: "sha256:70e19ab2de2511b4674b7ae8ff300fc35e4e6728bef07ee80d7903b75e71dbe9"
  pullPolicy: IfNotPresent

runAsUser: 1000 # the `node` user of the base image

containerPort: {name: http, port: 8080}

service:
  enabled: true
  type: ClusterIP
  port: 8080
  nodePort: null

env:
  SEARCH_API_URL: http://search-api:8000
  CATALOG_URL: http://catalog:8080
  # No FAULT_* defaults here: a pod variable overrides the image's ENV, and the
  # bad releases of chaos/ (F02, F03) bake their fault flag into the image.

extraEnv: []

readinessProbe:
  httpGet: {path: /readyz, port: http}
  periodSeconds: 5
livenessProbe:
  httpGet: {path: /healthz, port: http}
  periodSeconds: 10

# The stateless services may run on kind's tainted worker node, the target of
# fault F14 (infra/kind/cluster.yaml). Harmless where no node has the taint.
tolerations:
  - {key: incidentlens.dev/pool, operator: Equal, value: workload, effect: NoSchedule}

resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {cpu: 500m, memory: 160Mi}

autoscaling:
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilization: 70

# Traces and metrics go to the collector agent on the same node (the Service
# routes node-locally). Logs are read from stdout by the same agent.
otel:
  enabled: true
  endpoint: http://otel-agent.monitoring.svc:4318
  metricExportIntervalMs: 15000

rollout:
  pauseSeconds: 60
  progressDeadlineSeconds: 300

analysis:
  mode: http
  prometheusAddress: http://prometheus-operated.monitoring.svc:9090
  initialDelay: 45s
  interval: 30s
  requestsMetric: http_server_request_duration_seconds_count
  bucketMetric: http_server_request_duration_seconds_bucket
  errorMatcher: http_response_status_code=~"5.."
  maxErrorRateIncrease: 0.01
  maxP95Seconds: 0.3 # the latency SLO
  maxP95IncreaseSeconds: 0.1
