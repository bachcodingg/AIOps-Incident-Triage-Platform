apiVersion: v1
kind: Service
metadata:
  name: catalog
  labels: {app.kubernetes.io/name: catalog, app.kubernetes.io/part-of: shopsearch}
spec:
  selector: {app.kubernetes.io/name: catalog}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  labels: {app.kubernetes.io/name: catalog, app.kubernetes.io/part-of: shopsearch}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: catalog}
  template:
    metadata:
      labels: {app.kubernetes.io/name: catalog, app.kubernetes.io/part-of: shopsearch}
    spec:
      containers:
        - name: catalog
          image: incidentlens/catalog:dev
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: QUARKUS_DATASOURCE_JDBC_URL, value: "jdbc:postgresql://postgres:5432/catalog"}
            - {name: QUARKUS_DATASOURCE_USERNAME, value: catalog}
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: password}}
            - {name: QUARKUS_REDIS_HOSTS, value: "redis://redis:6379"}
          startupProbe:
            httpGet: {path: /q/health/started, port: http}
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet: {path: /q/health/ready, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /q/health/live, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 384Mi}
