image:
  repository: ghcr.io/bachcodingg/incidentlens/search-api
  tag: unreleased # release.yml opens the pull request that updates tag and digest
  digest: ""
  pullPolicy: IfNotPresent

runAsUser: 10001

containerPort: {name: http, port: 8000}

service:
  enabled: true
  type: ClusterIP
  port: 8000
  nodePort: null

env:
  REDIS_URL: redis://redis:6379/0

extraEnv: []

readinessProbe:
  httpGet: {path: /readyz, port: http}
  periodSeconds: 5
livenessProbe:
  httpGet: {path: /healthz, port: http}
  periodSeconds: 10

resources:
  requests: {cpu: 50m, memory: 96Mi}
  limits: {cpu: 500m, memory: 192Mi}

autoscaling:
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilization: 70

# Traces and metrics go to the collector agent on the same node (the Service
# routes node-locally). Logs are read from stdout by the same agent.
otel:
  enabled: true
  endpoint: http://otel-agent.monitoring.svc:4318
  metricExportIntervalMs: 15000

rollout:
  pauseSeconds: 60
  progressDeadlineSeconds: 300

analysis:
  mode: http
  prometheusAddress: http://prometheus-operated.monitoring.svc:9090
  initialDelay: 45s
  interval: 30s
  requestsMetric: http_server_request_duration_seconds_count
  bucketMetric: http_server_request_duration_seconds_bucket
  errorMatcher: http_response_status_code=~"5.."
  maxErrorRateIncrease: 0.01
  maxP95Seconds: 0.3 # the latency SLO
  maxP95IncreaseSeconds: 0.1
