image:
  repository: ghcr.io/bachcodingg/incidentlens/indexer
  tag: sha-1d05aae5580892b684354737e51d9aadd030aa2f
  digest: "sha256:6bfd2bf71e5e76fbf56c07dcfe0ef03bfa10c240c59fe55fc94981397afeda59"
  pullPolicy: IfNotPresent

runAsUser: 10001

containerPort: {name: health, port: 8081}

# A worker: nothing connects to it, so it has no Service.
service:
  enabled: false

env:
  REDIS_URL: redis://redis:6379/0
  CATALOG_URL: http://catalog:8080

extraEnv: []

readinessProbe:
  httpGet: {path: /readyz, port: health}
  periodSeconds: 5
livenessProbe:
  httpGet: {path: /healthz, port: health}
  periodSeconds: 10

resources:
  requests: {cpu: 25m, memory: 48Mi}
  limits: {cpu: 250m, memory: 128Mi}

# BRPOP hands each event to exactly one consumer, so extra replicas are safe.
autoscaling:
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilization: 70

# Traces and metrics go to the collector agent on the same node (the Service
# routes node-locally). Logs are read from stdout by the same agent.
otel:
  enabled: true
  endpoint: http://otel-agent.monitoring.svc:4318
  metricExportIntervalMs: 15000

rollout:
  pauseSeconds: 60
  progressDeadlineSeconds: 300

analysis:
  mode: worker
  prometheusAddress: http://prometheus-operated.monitoring.svc:9090
  initialDelay: 45s
  interval: 30s
